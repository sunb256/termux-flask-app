[project]
name = "app"
version = "0.1.3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1,<4",
    "waitress>=3,<4",
]

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/backend"]

[tool.setuptools.package-data]
app = [
    "web/*",
    "web/assets/*",
]